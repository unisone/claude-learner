name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets and PII
        run: |
          echo "=== Scanning for secrets ==="
          FOUND=0

          PATTERNS=(
            "OpenAI API key|sk-[a-zA-Z0-9_-]{20,}"
            "Slack bot token|xoxb-[0-9A-Za-z-]+"
            "GitHub personal token|ghp_[0-9A-Za-z]{36}"
            "AWS access key|AKIA[0-9A-Z]{16}"
            "Private key header|-----BEGIN (RSA |EC |DSA )?PRIVATE KEY-----"
            "Anthropic API key|sk-ant-[a-zA-Z0-9-]{20,}"
            "Bearer token|Bearer\s+[a-zA-Z0-9._-]{20,}"
          )

          for entry in "${PATTERNS[@]}"; do
            LABEL="${entry%%|*}"
            REGEX="${entry#*|}"
            if grep -rPn "$REGEX" --include='*.ts' --include='*.js' --include='*.json' --include='*.md' --include='*.yml' --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='dist' --exclude='ci.yml' --exclude='.env.example' . 2>/dev/null; then
              echo "::error::BLOCKED: Found potential $LABEL"
              FOUND=1
            fi
          done

          # Check for private filesystem paths
          if grep -rPn '/Users/[a-zA-Z]+/' --include='*.ts' --include='*.js' --include='*.html' --include='*.json' --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='dist' . 2>/dev/null; then
            echo "::error::BLOCKED: Found private filesystem paths"
            FOUND=1
          fi

          # Check for private IPs
          if grep -rPn '(?:100\.\d+\.\d+\.\d+|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+)' --include='*.ts' --include='*.js' --include='*.json' --include='*.md' --exclude-dir='.git' --exclude-dir='node_modules' --exclude-dir='dist' --exclude='ci.yml' . 2>/dev/null; then
            echo "::error::BLOCKED: Found private IP addresses"
            FOUND=1
          fi

          if [ "$FOUND" -eq 1 ]; then
            exit 1
          fi
          echo "Security scan passed."

  build:
    runs-on: ubuntu-latest
    needs: security-scan

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run type check
        run: npx tsc --noEmit

      - name: Audit dependencies
        run: npm audit --audit-level=high || true

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Uncomment when ready to publish
      # - name: Publish to npm
      #   run: npm publish
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
